
name: DevKit CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Check Code Style
        run: npm run lint

      - name: Check TypeScript
        run: npx tsc -b

      - name: Run Tests
        run: npm test

      - name: Build Production App
        run: npm run build
